# Colony agent runtime configuration. Single file, YAML.
#
# Default search path: `config/colony.yaml`. Override via the
# `COLONY_CONFIG_PATH` env var.
#
# Routing here is non-secret. If you put literal `api_key: "sk-..."` values
# in the file, set `allow_literal_keys: true` AND encrypt the file with
# SOPS. The simpler pattern is `api_key: ENV_VAR_NAME` and let dotenv /
# Kubernetes Secret supply the value.
#
# OAuth providers (Codex, Claude Pro) keep no token material here — tokens
# are resolved at run time by a connection loader the caller injects.

agent_runtime: pi
allow_literal_keys: false
# Human approval gates. `yolo` removes human approval; only use it when
# unattended operation is explicitly intended and bot evidence is trusted.
hitl:
  mode: gated

# LLM review of every MR before the merge gate. `required` dispatches a
# reviewer run per head SHA; request_changes requeues the implementer.
review:
  mode: off

providers:
  # ── OpenAI-compatible gateway/provider ───────────────────────────────
  openai_compatible:
    api: openai-completions
    base_url: https://litellm.home.shdr.ch/v1
    auth:
      kind: api_key
      value: COLONY_OPENAI_COMPATIBLE_API_KEY
    models:
      - id: router/mimo-v2.5-pro
        name: mimo-v2.5-pro
        reasoning: true
        context_window: 1000000
        max_tokens: 131072
        cost: { input: 0, output: 0 }
      - id: router/glm-5.2
        name: glm-5.2
        reasoning: true
        context_window: 1000000
        max_tokens: 131072
        cost: { input: 0, output: 0 }
      - id: kimi/k3
        name: kimi-k3
        reasoning: true
        context_window: 1048576
        max_tokens: 131072
        cost: { input: 0, output: 0 }
      - id: router/deepseek-v4-pro
        name: deepseek-v4-pro
        reasoning: true
        context_window: 1048576
        max_tokens: 384000
        cost: { input: 0, output: 0 }
      - id: router/deepseek-v4-flash
        name: deepseek-v4-flash
        reasoning: true
        context_window: 1048576
        max_tokens: 384000
        cost: { input: 0, output: 0 }
      - id: qwen-cloud/qwen3.8-max
        name: qwen3.8-max
        reasoning: true
        context_window: 1000000
        max_tokens: 131072
        cost: { input: 0, output: 0 }
      - id: aether/qwen3.8-27b
        name: qwen3.8-27b
        reasoning: true
        context_window: 262144
        # Operational generation cap; the deployed llama-server shares this
        # model's 262144-token context between prompt and completion.
        max_tokens: 32768
        cost: { input: 0, output: 0 }
      - id: ollama-cloud/kimi-k2.6
        name: kimi-k2.6
        context_window: 128000
        max_tokens: 16384
        cost: { input: 0, output: 0 }

  # ── OAuth providers (subscription-backed; tokens in Postgres) ────────
  openai_codex:
    api: openai-codex-responses
    auth:
      kind: oauth
      subscription: chatgpt_plus
    models:
      - id: gpt-5.5
        name: gpt-5.5
        reasoning: true
        input: [text, image]
        context_window: 272000
        max_tokens: 128000
        cost: { input: 5, output: 30, cache_read: 0.5, cache_write: 0 }
      - id: gpt-5.4-mini
        name: gpt-5.4-mini
        reasoning: true
        context_window: 272000
        max_tokens: 128000

  anthropic_pro:
    api: anthropic-messages
    auth:
      kind: oauth
      subscription: claude_pro
    models:
      - id: claude-sonnet-4-20250514
        name: sonnet-4-via-pro

agents:
  # Model split (2026-07): developer on MiMo v2.5 Pro, architect on GLM 5.2,
  # reviewer on Kimi K3 — all via the LiteLLM gateway (openai_compatible).
  developer:
    provider: openai_compatible
    model: mimo-v2.5-pro
    # For subscription-backed Codex instead:
    # provider: openai_codex
    # model: gpt-5.5
    # thinking_level: high
    timeout_ms: 1800000
    max_turns: 250
    max_usd_per_run: 50
  reviewer:
    provider: openai_compatible
    model: kimi-k3
    # Tried in order within the same Pi session and colonyd attempt.
    fallback_models:
      [qwen3.8-max, glm-5.2, deepseek-v4-pro, deepseek-v4-flash, qwen3.8-27b]
    timeout_ms: 1800000
    max_turns: 200
    max_usd_per_run: 30
  architect:
    provider: openai_compatible
    model: glm-5.2
    timeout_ms: 1800000
    max_turns: 200
    max_usd_per_run: 50
  memory_consolidator:
    provider: openai_compatible
    model: glm-5.2
