# Local infra for Colony dev loop (ADR-004).
# Boots Postgres 16 with the three Colony databases, Temporal server with
# auto-setup, and the Temporal Web UI. App processes run natively via
# `npm run dev` — they are not in this file.
services:
  postgres:
    image: postgres:17.9-alpine
    container_name: colony-postgres
    environment:
      POSTGRES_USER: colony
      POSTGRES_PASSWORD: colony
      # POSTGRES_DB is not used because init SQL creates all three databases
      POSTGRES_MULTIPLE_DATABASES: colony,temporal,temporal_visibility
    ports:
      - "5432:5432"
    volumes:
      - colony-postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/00-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colony -d colony"]
      interval: 2s
      timeout: 5s
      retries: 30

  temporal:
    image: temporalio/auto-setup:1.29.6
    container_name: colony-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: colony
      POSTGRES_PWD: colony
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 30

  temporal-ui:
    image: temporalio/ui:2.49.1
    container_name: colony-temporal-ui
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8233:8080"

volumes:
  colony-postgres-data:
