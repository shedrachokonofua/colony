# Colony task runner. Thin orchestration over npm scripts + secrets workflow.
# npm scripts remain the source of truth for build/test/lint; tasks bundle
# things that need the bao token + sops decryption around them.
#
# Run `task --list` for the menu.

version: "3"

vars:
  BAO_LOGIN: ./scripts/bao-login.sh
  SECRETS_FILE: secrets/dev.yaml

tasks:
  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------
  bao:login:
    desc: Authenticate to OpenBao via Keycloak device flow (caches to ~/.colony-toolbox/bao/token)
    cmds:
      - "{{.BAO_LOGIN}}"

  bao:status:
    desc: Show colony bao token state
    cmds:
      - "{{.BAO_LOGIN}} --status"

  bao:
    desc: "Run a bao CLI command with the colony token (e.g. `task bao -- token lookup`)"
    cmds:
      - "{{.BAO_LOGIN}} --exec bao {{.CLI_ARGS}}"

  # ---------------------------------------------------------------------------
  # Secrets
  # ---------------------------------------------------------------------------
  se:
    desc: Edit encrypted secrets
    aliases: [secrets:edit]
    preconditions:
      - sh: command -v sops
        msg: "sops not found — enter `nix develop` first"
    cmds:
      - "{{.BAO_LOGIN}} --exec sops {{.SECRETS_FILE}}"

  sl:
    desc: List secret keys
    aliases: [secrets:list]
    preconditions:
      - sh: command -v sops
        msg: "sops not found — enter `nix develop` first"
    cmds:
      - '{{.BAO_LOGIN}} --exec sh -c ''sops -d {{.SECRETS_FILE}} | yq -r "[paths(scalars)] | .[] | \".\" + join(\".\")"'''

  sd:
    desc: Decrypt secrets to stdout (use sparingly)
    aliases: [secrets:decrypt]
    cmds:
      - "{{.BAO_LOGIN}} --exec sops -d {{.SECRETS_FILE}}"

  # ---------------------------------------------------------------------------
  # Local stack
  # ---------------------------------------------------------------------------
  up:
    desc: Start the local docker-compose stack (Postgres + Temporal)
    cmds:
      - docker-compose up -d

  down:
    desc: Stop the local docker-compose stack
    cmds:
      - docker-compose down

  reset:
    desc: Stop the stack and wipe all volumes (destructive)
    prompt: This drops all local Postgres + Temporal data. Continue?
    cmds:
      - docker-compose down -v

  db:migrate:
    desc: Apply DB migrations
    cmds:
      - npm run db:migrate

  db:migrate:down:
    desc: Roll back the last DB migration
    cmds:
      - npm run db:migrate:down

  # ---------------------------------------------------------------------------
  # Dev / test
  # ---------------------------------------------------------------------------
  dev:
    desc: Run all local services (api, worker, webhook-dispatcher, tool-gateway, web)
    cmds:
      - npm run dev

  test:
    desc: Run unit tests (no DB / no external services)
    cmds:
      - npm run test:unit

  test:integration:
    desc: Run integration tests (requires the local stack — see `task up`)
    cmds:
      - COLONY_TEST_DATABASE_URL=postgres://colony:colony@localhost:5432/colony_test npm run test:integration

  test:live:gitlab:
    desc: Run the live multi-repo GitLab integration test against the homelab GitLab
    summary: |
      Self-bootstraps a throwaway group, two projects, runs the full issue
      lifecycle on both, then deletes the group. Requires GITLAB_BASE_URL +
      GITLAB_TOKEN — pulled from secrets/dev.yaml at runtime.
    cmds:
      - "{{.BAO_LOGIN}} --exec sops exec-env {{.SECRETS_FILE}} 'npm run test:integration --workspace @colony/provider-gitlab'"

  acceptance:phase1:
    desc: Run Phase 1 acceptance against the homelab GitLab dev project
    summary: |
      Creates a throwaway GitLab project, opens provider scope/task issues,
      runs the supervisor ready/claim/provider-projection path, and verifies
      the Task Graph + provider projection audit. Requires GITLAB_BASE_URL
      and GITLAB_TOKEN from secrets/dev.yaml.
    cmds:
      - "{{.BAO_LOGIN}} --exec sops exec-env {{.SECRETS_FILE}} 'npm run acceptance:phase1'"

  acceptance:phase2:
    desc: Run Phase 2 live acceptance (AGENT_RUNTIME=pi) against the homelab GitLab
    summary: |
      Live-by-default. Creates a throwaway GitLab project, walks one task
      through Developer (pi-coding-agent) and Reviewer (pi-agent-core),
      opens a real MR, records human approval + green pipeline, merges, and
      closes — then deletes the project group.

      Prerequisites:
        - `task up` (Postgres + Temporal running locally).
        - GITLAB_BASE_URL + GITLAB_TOKEN in secrets/dev.yaml.
        - config/colony.yaml configured with developer + reviewer providers.
          api_key providers need their referenced env var set; oauth
          providers (Codex, Claude Pro) need an active connection in
          provider_oauth_connections (Web UI → admin → providers).
        - The script refuses AGENT_RUNTIME=fake — fake is reserved for
          unit/integration tests.

      Teardown: throwaway GitLab group is deleted in `finally` even on
      failure; per-run Postgres rows are left for forensic inspection.

      Failure modes audited on the scope (visible at /scopes/:id):
        - acceptance.runtime.error  (Pi import / missing credential / rate
          limit / runtime exception)
        - developer.run.rejected, developer.envelope.stale (envelope path)
    cmds:
      - "{{.BAO_LOGIN}} --exec sops exec-env {{.SECRETS_FILE}} 'npm run acceptance:phase2'"

  acceptance:phase3:
    desc: Run Phase 3 live acceptance (architect → reviewer → developer → merge → scope close)
    summary: |
      Live-by-default. Bootstraps a throwaway GitLab group/project, drives a
      draft scope through architect decomposition, decomposition review, DAG
      commit, and per-task developer/reviewer/merge/close, then closes the
      scope. The developer agent does its own coding, commit, and push using
      the Pi coding-agent runner against a cloned working tree.

      Prerequisites: same as acceptance:phase2 plus an active Codex (or
      configured) OAuth connection in provider_oauth_connections.
    cmds:
      - "{{.BAO_LOGIN}} --exec sops exec-env {{.SECRETS_FILE}} 'npm run acceptance:phase3'"

  test:all:
    desc: All tests (unit + integration + live GitLab)
    cmds:
      - "{{.BAO_LOGIN}} --exec sops exec-env {{.SECRETS_FILE}} 'COLONY_TEST_DATABASE_URL=postgres://colony:colony@localhost:5432/colony_test npm test'"

  # ---------------------------------------------------------------------------
  # Code quality
  # ---------------------------------------------------------------------------
  typecheck:
    desc: Run tsc + svelte-check
    cmds:
      - npm run typecheck

  lint:
    desc: Run eslint
    cmds:
      - npm run lint

  format:
    desc: Format with Prettier
    cmds:
      - npm run format

  ci:
    desc: typecheck + lint + unit tests
    cmds:
      - task: typecheck
      - task: lint
      - task: test

  hooks:install:
    desc: Point git at scripts/git-hooks (auto-runs after `npm install`)
    cmds:
      - npm run hooks:install

  precommit:
    desc: Run the same checks the pre-commit hook runs (validate + unit tests)
    cmds:
      - ./scripts/git-hooks/pre-commit
