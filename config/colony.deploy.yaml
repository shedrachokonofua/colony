# Production agent config baked into the colonyd image (see Dockerfile).
# The aether-side deployment points COLONY_CONFIG_PATH here; editing this
# file redeploys colonyd through the normal image build on main.
agent_runtime: pi
allow_literal_keys: false

hitl:
  mode: yolo

review:
  mode: required

providers:
  openai_compatible:
    api: openai-completions
    base_url: https://litellm.home.shdr.ch/v1
    auth:
      kind: api_key
      value: COLONY_OPENAI_COMPATIBLE_API_KEY
    models:
      - id: router/mimo-v2.5-pro
        name: mimo-v2.5-pro
        reasoning: true
        context_window: 1000000
        max_tokens: 131072
        cost: { input: 0, output: 0 }
      - id: commandcode/muse-spark-1.2-contributor
        name: muse-spark
        reasoning: true
        context_window: 1048576
        max_tokens: 131072
        cost: { input: 0, output: 0 }
      - id: router/glm-5.2
        name: glm-5.2
        reasoning: true
        context_window: 1000000
        max_tokens: 131072
        cost: { input: 0, output: 0 }
      - id: router/glm-5.3
        name: glm-5.3
        reasoning: true
        context_window: 1000000
        max_tokens: 131072
        cost: { input: 0, output: 0 }
      - id: kimi/k3
        name: kimi-k3
        reasoning: true
        context_window: 1048576
        max_tokens: 131072
        cost: { input: 0, output: 0 }
      - id: router/deepseek-v4-pro
        name: deepseek-v4-pro
        reasoning: true
        context_window: 1048576
        max_tokens: 384000
        cost: { input: 0, output: 0 }
      # Ollama-Cloud-only alias: the router/deepseek-v4-flash group shuffles
      # in a cline-pass leg whose Vercel upstream fails streaming requests.
      # Pin the healthy leg; keep the router alias as an explicit fallback.
      - id: ollama-cloud/deepseek-v4-flash
        name: deepseek-v4-flash
        reasoning: true
        context_window: 1048576
        max_tokens: 384000
        cost: { input: 0, output: 0 }
      - id: router/deepseek-v4-flash
        name: deepseek-v4-flash-router
        reasoning: true
        context_window: 1048576
        max_tokens: 384000
        cost: { input: 0, output: 0 }
      - id: qwen-cloud/qwen3.8-max
        name: qwen3.8-max
        reasoning: true
        context_window: 1000000
        max_tokens: 131072
        cost: { input: 0, output: 0 }
      - id: aether/qwen3.8-27b
        name: qwen3.8-27b
        reasoning: true
        context_window: 262144
        # Operational generation cap; the deployed llama-server shares this
        # model's 262144-token context between prompt and completion.
        max_tokens: 32768
        cost: { input: 0, output: 0 }

agents:
  developer:
    provider: openai_compatible
    model: muse-spark
    fallback_models:
      [deepseek-v4-flash, deepseek-v4-flash-router, mimo-v2.5-pro, qwen3.8-27b]
    thinking_level: high
    timeout_ms: 1800000
    max_turns: 250
  reviewer:
    provider: openai_compatible
    model: kimi-k3
    fallback_models:
      - glm-5.3
      - qwen3.8-max
      - glm-5.2
      - deepseek-v4-pro
      - qwen3.8-27b
    thinking_level: xhigh
    timeout_ms: 1800000
    max_turns: 200
  architect:
    provider: openai_compatible
    model: glm-5.3
    fallback_models: [kimi-k3, glm-5.2, deepseek-v4-pro]
    timeout_ms: 1800000
    max_turns: 200
  memory_consolidator:
    provider: openai_compatible
    model: muse-spark
    thinking_level: low
