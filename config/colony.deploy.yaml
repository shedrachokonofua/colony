# Production agent config baked into the colonyd image (see Dockerfile).
# The aether-side deployment points COLONY_CONFIG_PATH here; editing this
# file redeploys colonyd through the normal image build on main.
#
# Web research (env-gated): web_search/web_fetch are enabled only when
# COLONY_SEARXNG_URL is set (e.g. https://searxng.home.shdr.ch). No API key.
# Activation in this file is deferred — the aether deployment sets the env
# separately after this change merges.
agent_runtime: pi
allow_literal_keys: false

sandbox:
  engine: kubernetes
  kubernetes:
    namespace: colony-sandboxes
    image: registry.gitlab.home.shdr.ch/so/colony/sandbox:latest

hitl:
  mode: yolo

review:
  mode: required

providers:
  openai_compatible:
    api: openai-completions
    base_url: https://litellm.home.shdr.ch/v1
    auth:
      kind: api_key
      value: COLONY_OPENAI_COMPATIBLE_API_KEY
    models:
      - id: router/mimo-v2.5-pro
        name: mimo-v2.5-pro
        reasoning: true
        context_window: 1000000
        max_tokens: 131072
        cost: { input: 0, output: 0 }
      - id: commandcode/muse-spark-1.2-contributor
        name: muse-spark
        reasoning: true
        context_window: 1048576
        # Operational cap, not the model's limit. Turn telemetry from a walled
        # 30-minute run: median turn 404 output tokens, but outliers reached
        # 30k tokens / 203 seconds, and 27 of the 30 minutes went to model
        # generation. Bounding a single response keeps the run acting instead
        # of monologuing.
        max_tokens: 16384
        cost: { input: 0, output: 0 }
      - id: router/glm-5.2
        name: glm-5.2
        reasoning: true
        context_window: 1000000
        max_tokens: 131072
        cost: { input: 0, output: 0 }
      - id: router/glm-5.3
        name: glm-5.3
        reasoning: true
        context_window: 1000000
        max_tokens: 131072
        cost: { input: 0, output: 0 }
      # Stealth alpha via the opencode Go credential (upstream ox-alpha-free).
      # Published: 1M context, 131072 max output (openrouter.ai/stealth/ox-alpha).
      - id: opencode-go/ox-alpha
        name: ox-alpha
        reasoning: true
        context_window: 1048576
        max_tokens: 131072
        cost: { input: 0, output: 0 }
      - id: kimi/k3
        name: kimi-k3
        reasoning: true
        context_window: 1048576
        max_tokens: 131072
        cost: { input: 0, output: 0 }
      - id: router/deepseek-v4-pro
        name: deepseek-v4-pro
        reasoning: true
        context_window: 1048576
        max_tokens: 384000
        cost: { input: 0, output: 0 }
      - id: router/deepseek-v4-flash
        name: deepseek-v4-flash
        reasoning: true
        context_window: 1048576
        max_tokens: 384000
        cost: { input: 0, output: 0 }
      - id: qwen-cloud/qwen3.8-max
        name: qwen3.8-max
        reasoning: true
        context_window: 1000000
        max_tokens: 131072
        cost: { input: 0, output: 0 }
      - id: aether/qwen3.8-27b
        name: qwen3.8-27b
        reasoning: true
        context_window: 262144
        # Operational generation cap; the deployed llama-server shares this
        # model's 262144-token context between prompt and completion.
        max_tokens: 32768
        cost: { input: 0, output: 0 }

agents:
  # Budgets sized from observed run durations (12h window, 2026-08-18):
  # implement 20-26 min at the old 30 min cap, review 10-23 min, plan 8-25 min.
  developer:
    provider: openai_compatible
    model: ox-alpha
    fallback_models: [muse-spark, deepseek-v4-flash, mimo-v2.5-pro, qwen3.8-27b]
    thinking_level: medium
    timeout_ms: 3600000
    max_turns: 250
  reviewer:
    provider: openai_compatible
    model: kimi-k3
    fallback_models:
      - glm-5.3
      - qwen3.8-max
      - glm-5.2
      - deepseek-v4-pro
      - qwen3.8-27b
    thinking_level: xhigh
    timeout_ms: 2700000
    max_turns: 200
  architect:
    provider: openai_compatible
    model: glm-5.3
    fallback_models: [kimi-k3, glm-5.2, deepseek-v4-pro]
    timeout_ms: 2700000
    max_turns: 200
  memory_consolidator:
    provider: openai_compatible
    model: muse-spark
    thinking_level: low
