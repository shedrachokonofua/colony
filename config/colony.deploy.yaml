# Production agent config baked into the colonyd image (see Dockerfile).
# The aether-side deployment points COLONY_CONFIG_PATH here; editing this
# file redeploys colonyd through the normal image build on main.
#
# Web research (env-gated): web_search/web_fetch are enabled only when
# COLONY_SEARXNG_URL is set (e.g. https://searxng.home.shdr.ch). No API key.
# Activation in this file is deferred — the aether deployment sets the env
# separately after this change merges.
agent_runtime: pi
allow_literal_keys: false

sandbox:
  engine: kubernetes
  kubernetes:
    namespace: colony-sandboxes
    image: registry.gitlab.home.shdr.ch/so/colony/sandbox:latest

# Run-audit artifact store. The deployed pod's image rootfs is not writable
# by uid 1000; the PVC at /var/lib/colonyd is. The default (data/artifacts,
# relative to cwd /workspace) crashed boot on 2026-08-30 — keep this absolute.
artifacts:
  kind: local
  local:
    dir: /var/lib/colonyd/artifacts

hitl:
  mode: yolo

review:
  mode: required

providers:
  openai_compatible:
    api: openai-completions
    base_url: https://litellm.home.shdr.ch/v1
    auth:
      kind: api_key
      value: COLONY_OPENAI_COMPATIBLE_API_KEY
    models:
      - id: router/muse-spark-1.2-contributor
        name: muse-spark
        reasoning: true
        context_window: 1048576
        # Operational cap, not the model's limit. Turn telemetry from a walled
        # 30-minute run: median turn 404 output tokens, but outliers reached
        # 30k tokens / 203 seconds, and 27 of the 30 minutes went to model
        # generation. Bounding a single response keeps the run acting instead
        # of monologuing.
        max_tokens: 16384
        cost: { input: 0, output: 0 }
      - id: router/glm-5.3
        name: glm-5.3
        reasoning: true
        context_window: 1000000
        max_tokens: 131072
        cost: { input: 0, output: 0 }
      # ox-alpha's free stealth preview ended; OpenRouter and aether's own
      # litellm config both confirm the named successor is GLM-5.3-Flash.
      # Pooled across 5 credentials (clinepass, zai, commandcode, opencode-go,
      # ollama-cloud) for quota resilience under developer's high turn volume.
      - id: router/glm-5.3-flash
        name: glm-5.3-flash
        reasoning: true
        context_window: 1048576
        max_tokens: 131072
        cost: { input: 0, output: 0 }
      # Temporary CodeBuddy Hy4 trial route. This endpoint is stream-only and
      # requires a leading system message; Pi's OpenAI transport satisfies both.
      - id: codebuddy/hy4-preview
        name: hy4-preview
        reasoning: true
        context_window: 1048576
        max_tokens: 64000
        cost: { input: 0, output: 0 }
      - id: kimi/k3
        name: kimi-k3
        reasoning: true
        context_window: 1048576
        max_tokens: 131072
        cost: { input: 0, output: 0 }
      - id: router/deepseek-v4-pro
        name: deepseek-v4-pro
        reasoning: true
        context_window: 1048576
        max_tokens: 384000
        cost: { input: 0, output: 0 }
      - id: router/deepseek-v4-flash
        name: deepseek-v4-flash
        reasoning: true
        context_window: 1048576
        max_tokens: 384000
        cost: { input: 0, output: 0 }
      - id: qwen-cloud/qwen3.8-max
        name: qwen3.8-max
        reasoning: true
        context_window: 1000000
        max_tokens: 131072
        cost: { input: 0, output: 0 }
      - id: aether/qwen3.8-27b
        name: qwen3.8-27b
        reasoning: true
        context_window: 262144
        # Operational generation cap; the deployed llama-server shares this
        # model's 262144-token context between prompt and completion.
        max_tokens: 32768
        cost: { input: 0, output: 0 }

agents:
  # Budgets sized from observed run durations (12h window, 2026-08-18):
  # implement 20-26 min at the old 30 min cap, review 10-23 min, plan 8-25 min.
  # 2026-08-30: developer 400 turns / 3 h. Hy4 measures ~47.6 tok/s with 6 s
  # TTFT (~2.3 turns/min), so 400 turns needs ~3 h; on GLM-Flash (~5.7
  # turns/min) turns bind near minute 70. Turns are the divergence guard;
  # the stall/liveness watchdogs cover hangs; the clock is the outer bound.
  # Revert to 5400000 if the coder returns to a GLM-Flash-class model.
  # Use Hy4 as the coder during CodeBuddy's launch trial. GLM-5.3-Flash is
  # first fallback so runs survive endpoint, quota, or promotion expiry.
  developer:
    provider: openai_compatible
    model: hy4-preview
    fallback_models: [glm-5.3-flash, deepseek-v4-flash, muse-spark, qwen3.8-27b]
    thinking_level: high
    timeout_ms: 10800000
    max_turns: 400
  reviewer:
    provider: openai_compatible
    model: kimi-k3
    fallback_models:
      - glm-5.3
      - qwen3.8-max
      - deepseek-v4-pro
      - qwen3.8-27b
    thinking_level: xhigh
    timeout_ms: 2700000
    max_turns: 200
  architect:
    provider: openai_compatible
    model: glm-5.3
    fallback_models: [kimi-k3, deepseek-v4-pro, qwen3.8-27b]
    timeout_ms: 2700000
    max_turns: 200
  memory_consolidator:
    provider: openai_compatible
    model: muse-spark
    thinking_level: low
