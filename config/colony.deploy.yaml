# Production agent config baked into the colonyd image (see Dockerfile).
# The aether-side deployment points COLONY_CONFIG_PATH here. CI bakes changes
# into a new image; aether pins its immutable digest and rolls it out through
# IaC after quiescing scopes. Keel is disabled; a build alone does not deploy.
#
# Web research (env-gated): web_search/web_fetch are enabled only when
# COLONY_SEARXNG_URL is set (e.g. https://searxng.home.shdr.ch). No API key.
# Activation in this file is deferred — the aether deployment sets the env
# separately after this change merges.
agent_runtime: pi
allow_literal_keys: false

sandbox:
  engine: kubernetes
  kubernetes:
    namespace: colony-sandboxes
    image: registry.gitlab.home.shdr.ch/so/colony/sandbox:latest

# Run-audit artifact store. The deployed pod's image rootfs is not writable
# by uid 1000; the PVC at /var/lib/colonyd is. The default (data/artifacts,
# relative to cwd /workspace) crashed boot on 2026-08-30 — keep this absolute.
artifacts:
  kind: local
  local:
    dir: /var/lib/colonyd/artifacts

# Same landmine as artifacts, second detonation (2026-09-01): the default
# data/sessions resolves against cwd /workspace and EACCES'd every run at
# session-manager creation. Keep absolute, on the PVC beside the DB.
sessions_dir: /var/lib/colonyd/sessions

hitl:
  mode: yolo

review:
  mode: required

providers:
  openai_compatible:
    api: openai-completions
    base_url: https://litellm.home.shdr.ch/v1
    auth:
      kind: api_key
      value: COLONY_OPENAI_COMPATIBLE_API_KEY
    models:
      # 2026-09-02: the 1.2-contributor route left the gateway; 1.3 (index 61,
      # 235 tok/s) replaces it. Contributor is $0.10/M input, $0.20/M output.
      - id: router/muse-spark-1.3-contributor
        name: muse-spark
        reasoning: true
        context_window: 1048576
        # Operational cap, not the model's limit. Turn telemetry from a walled
        # 30-minute run: median turn 404 output tokens, but outliers reached
        # 30k tokens / 203 seconds, and 27 of the 30 minutes went to model
        # generation. Bounding a single response keeps the run acting instead
        # of monologuing.
        max_tokens: 16384
        # 2026-09-25: the pool (Command Code Contributor + subscription bridge)
        # served bursts of 4 and 6 concurrent xhigh agent turns 20/20 in
        # 1.1-6.2 s with no 429s; 4 leaves headroom under that ceiling.
        max_parallel_runs: 4
        cost: { input: 0.1, output: 0.2, cache_read: 0.002 }
      - id: router/glm-5.3
        name: glm-5.3
        reasoning: true
        context_window: 1000000
        max_tokens: 131072
        # z.ai leg carries a weekly usage window; 2 covers architect demand
        # without letting a burst drain it.
        max_parallel_runs: 2
        cost: { input: 0, output: 0 }
      # GLM-5.3-Flash is the named successor to the ended Ox Alpha preview.
      # Pooled across Z.AI, Command Code, OpenCode Go, and Ollama Cloud for
      # quota resilience under developer's high turn volume.
      - id: router/glm-5.3-flash
        name: glm-5.3-flash
        reasoning: true
        context_window: 1048576
        max_tokens: 131072
        # Caps concurrently RUNNING runs across this entry's pooled credentials.
        # 2026-09-25: 4, the slot count for pools with good AA unit economics
        # ($0.25 per Intelligence Index task) that pass a burst: 4 and 6
        # concurrent turns went 20/20 across all four legs, no 429s. History's
        # 43 rate-limit faults predate the OpenCode Go session-header fix.
        max_parallel_runs: 4
        cost: { input: 0, output: 0 }
      - id: kimi/k3
        name: kimi-k3
        reasoning: true
        context_window: 1048576
        # K3 rejects named forced tool_choice while reasoning is enabled.
        compat:
          disableReasoningOnForcedToolChoice: true
        max_tokens: 131072
        # Weekly token window (exhausted 2026-08-30); 2 stops a review
        # stampede from draining it in one afternoon.
        max_parallel_runs: 2
        cost: { input: 0, output: 0 }
      - id: router/deepseek-v4-pro
        name: deepseek-v4-pro
        reasoning: true
        context_window: 1048576
        max_tokens: 384000
        # 2026-09-25: $0.67 per AA task; bursts of 4 and 6 concurrent turns
        # went 20/20 on Ollama Cloud with a 1.9 s worst case, no 429s.
        max_parallel_runs: 4
        cost: { input: 0, output: 0 }
      - id: aether/qwen3.8-27b
        name: qwen3.8-27b
        reasoning: true
        context_window: 262144
        # Operational generation cap; the deployed llama-server shares this
        # model's 262144-token context between prompt and completion.
        max_tokens: 32768
        # Shares one llama-server with interactive use; never double-book it.
        max_parallel_runs: 1
        cost: { input: 0, output: 0 }
      - id: router/muse-spark-1.3
        name: muse-spark-1.3
        reasoning: true
        context_window: 1048576
        max_tokens: 16384
        max_parallel_runs: 2
        cost: { input: 0, output: 0 }
      - id: antigravity/gemini-3.8-flash
        name: gemini-3.8-flash
        reasoning: true
        context_window: 1048576
        max_parallel_runs: 2
        cost: { input: 0, output: 0 }
      # Standard Grok 4.7 through the SuperGrok subscription bridge.
      - id: supergrok/grok-4.7
        name: grok-4.7
        reasoning: true
        context_window: 500000
        max_tokens: 65536
        max_parallel_runs: 4
        cost: { input: 0, output: 0 }
      # GPT-6 Astra via the ChatGPT subscription (LiteLLM chatgpt/*; the route
      # is streaming-only, which Pi's transport satisfies). The subscription
      # also serves the household's only OpenWebUI model, so Colony uses it
      # for plan review alone - its lowest-volume role - one run at a time.
      - id: chatgpt/gpt-6-astra
        name: gpt-6-astra
        reasoning: true
        # Operational cap: AA lists a 1M API context, but the subscription
        # route's limit is unverified.
        context_window: 272000
        max_tokens: 65536
        max_parallel_runs: 1
        cost: { input: 0, output: 0 }
      # MiMo V2.6 Pro through LiteLLM's priority pool: the Xiaomi token plan
      # first, Command Code and OpenCode Go only while it fails.
      - id: router/mimo-v2.6-pro
        name: mimo-v2.6-pro
        reasoning: true
        context_window: 1000000
        max_tokens: 131072
        # A named forced tool_choice gets a different tool call back
        # (2026-09-25 probe), so finalizers steer it instead of forcing.
        compat:
          supportsForcedToolChoice: false
        # 2026-09-25: matches muse-spark. Bursts of 4 and 6 concurrent xhigh
        # agent turns went 20/20, all on the Xiaomi priority leg (no failover
        # to the capped OpenCode Go leg), median 2.8-8 s, no 429s.
        max_parallel_runs: 4
        cost: { input: 0, output: 0 }
      # Step 5 Preview on the Step Plan subscription: a quota pool no other
      # role draws on. Step's API reports 1,024,000 input tokens. It reasons
      # verbosely on open-ended prose (2.5-3.7k tokens for a 400-word answer),
      # so the output cap bounds a runaway turn the way muse-spark's does.
      - id: step/step-5-preview
        name: step-5-preview
        reasoning: true
        context_window: 1024000
        max_tokens: 32768
        # Honoured a named forced tool_choice 1/3 (2026-09-25 probe) while
        # self-submitting 4/4 in two-turn agent loops, so finalizers steer it.
        compat:
          supportsForcedToolChoice: false
        # 2026-09-25: $0.72 per AA task; bursts of 4 and 6 concurrent xhigh
        # turns went 20/20 on the Step Plan, no 429s.
        max_parallel_runs: 4
        cost: { input: 0, output: 0 }

agents:
  # Budgets sized from observed run durations (12h window, 2026-08-18):
  # implement 20-26 min at the old 30 min cap, review 10-23 min, plan 8-25 min.
  # 2026-08-30 raised developer to 400 turns / 3 h for Hy4 (~2.3 turns/min).
  # 2026-09-25: Hy4 left the chain (no longer free), so the clock returns to
  # 90 min as planned for faster coders. Turns are the divergence guard; the
  # stall/liveness watchdogs cover hangs; the clock is the outer bound.
  #
  # 2026-09-25 holistic re-pick. Evidence per model: Colony history (runs as
  # the starting model, 45 days to 2026-09-09), AA Intelligence Index v4.3.2
  # (plus AA-LCR where AA exposes it), and a role-suitability run through
  # LiteLLM: 2 sessions per model and role in a convention-bearing repo,
  # graded deterministically, submitting through Colony's real envelope
  # validators with the steer-then-force finalizer. Chain members passed
  # their role there unless noted; chains order by history, then quality,
  # then speed. Dropped: qwen3.8-max (9-11 min sessions, p90 turn 104 s,
  # rejects forced tool_choice, worst reviewer record 10/33), qwen3.8-flash
  # (0/2 as developer: never submitted, forced submit HTTP 400),
  # step-5-preview as developer (1/2: never submitted), and
  # gemini-3.8-flash as architect (1/2: missed docs and SQL conventions).
  #
  # developer: muse-spark (20/4 implement; 2/2 in 21 s), mimo-v2.6-pro
  # (AA 46; 2/2 voluntary), gemini-3.8-flash (34/16, mostly infra; 2/2 only
  # via the forced finalizer, which it honours), glm-5.3-flash (2/2 in 32 s;
  # rate-limited history), deepseek-v4-pro (2/2 in 8 s; Ollama Cloud pool).
  developer:
    provider: openai_compatible
    model: muse-spark
    fallback_models:
      [mimo-v2.6-pro, gemini-3.8-flash, glm-5.3-flash, deepseek-v4-pro]
    thinking_level: high
    timeout_ms: 5400000
    max_turns: 400
  # reviewer: grok-4.7 (AA 46; 2/2 in 31 s; honours a forced submit),
  # kimi-k3 (best review record 71/20; AA-LCR 88.7%), glm-5.3 (22/27;
  # honours a forced submit), mimo-v2.6-pro (AA 46), deepseek-v4-pro (8/2;
  # 2/2 in 14 s), and muse-spark-1.3 last: muse-spark now writes the code.
  reviewer:
    provider: openai_compatible
    model: grok-4.7
    fallback_models:
      - kimi-k3
      - glm-5.3
      - mimo-v2.6-pro
      - deepseek-v4-pro
      - muse-spark-1.3
    thinking_level: xhigh
    timeout_ms: 2700000
    max_turns: 200
  # The plan reviewer must not be the plan's author: muse-spark leads the
  # architect chain, so no muse model reviews plans. gpt-6-astra leads
  # (AA 53, the gateway's highest; 2/2 with all 5 planted flaws, 33 s).
  # grok-4.7 is now measured: 2/2, all 5 flaws, voluntary submit in 32 s
  # (4.6 submitted 0/10 plan reviews in production). Then kimi-k3 (12/0 plan
  # reviews; AA-LCR 88.7%), glm-5.3, mimo-v2.6-pro (AA-LCR 86.3%), and
  # step-5-preview (AA 44, AA-LCR 88.3%; 2/2 all 5 flaws; Step Plan pool).
  plan_reviewer:
    provider: openai_compatible
    model: gpt-6-astra
    fallback_models:
      - grok-4.7
      - kimi-k3
      - glm-5.3
      - mimo-v2.6-pro
      - step-5-preview
    thinking_level: xhigh
    timeout_ms: 2700000
    max_turns: 200
  # architect: muse-spark leads (46/10 as architect; 2/2 in 90 s). Then
  # glm-5.3 (30/48, mostly infra faults; honours a forced submit), grok-4.7
  # (honours a forced submit; 2/2), kimi-k3 (AA-LCR 88.7%; forced with
  # reasoning off), mimo-v2.6-pro (AA 46), deepseek-v4-pro (5/1; 2/2 in 48 s).
  architect:
    provider: openai_compatible
    model: muse-spark
    fallback_models:
      [glm-5.3, grok-4.7, kimi-k3, mimo-v2.6-pro, deepseek-v4-pro]
    thinking_level: xhigh
    timeout_ms: 2700000
    max_turns: 200
  memory_consolidator:
    provider: openai_compatible
    model: muse-spark
    thinking_level: low
