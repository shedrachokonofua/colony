# Colony agent runtime configuration. Single file, YAML.
#
# Default search path: `config/colony.yaml`. Override via the
# `COLONY_CONFIG_PATH` env var (set by the worker bootstrap).
#
# Routing here is non-secret. If you put literal `api_key: "sk-..."` values
# in the file, set `allow_literal_keys: true` AND encrypt the file with
# SOPS. The simpler pattern is `api_key: ENV_VAR_NAME` and let dotenv /
# Kubernetes Secret supply the value.
#
# OAuth providers (Codex, Claude Pro) keep no token material here — tokens
# live in the `provider_oauth_connections` Postgres table and are managed
# from the Colony Web UI (admin → providers).

agent_runtime: pi
allow_literal_keys: false

providers:
  # ── OpenAI-compatible gateway/provider ───────────────────────────────
  openai_compatible:
    api: openai-completions
    base_url: https://litellm.home.shdr.ch/v1
    auth:
      kind: api_key
      value: COLONY_OPENAI_COMPATIBLE_API_KEY
    models:
      - id: ollama-cloud/kimi-k2.6
        name: kimi-k2.6
        context_window: 128000
        max_tokens: 16384
        cost: { input: 0, output: 0 }

  # ── OAuth providers (subscription-backed; tokens in Postgres) ────────
  openai_codex:
    api: openai-codex-responses
    auth:
      kind: oauth
      subscription: chatgpt_plus
    models:
      - id: gpt-5.5
        name: gpt-5.5
        reasoning: true
        input: [text, image]
        context_window: 272000
        max_tokens: 128000
        cost: { input: 5, output: 30, cache_read: 0.5, cache_write: 0 }
      - id: gpt-5.4-mini
        name: gpt-5.4-mini
        reasoning: true
        context_window: 272000
        max_tokens: 128000

  anthropic_pro:
    api: anthropic-messages
    auth:
      kind: oauth
      subscription: claude_pro
    models:
      - id: claude-sonnet-4-20250514
        name: sonnet-4-via-pro

agents:
  developer:
    provider: openai_compatible
    model: kimi-k2.6
    # For subscription-backed Codex instead:
    # provider: openai_codex
    # model: gpt-5.5
    # thinking_level: high
    timeout_ms: 900000
    max_turns: 60
    max_usd_per_run: 10
  reviewer:
    provider: openai_codex
    model: gpt-5.5
    thinking_level: high
    timeout_ms: 600000
    max_turns: 30
    max_usd_per_run: 5
  architect:
    provider: openai_codex
    model: gpt-5.5
    thinking_level: high
    timeout_ms: 1800000
    max_turns: 80
    max_usd_per_run: 25
  memory_consolidator:
    provider: openai_compatible
    model: kimi-k2.6
