version: "3"

tasks:
  dev:
    desc: Run colonyd in watch mode
    cmds:
      - npm run dev

  check:
    desc: Typecheck + unit tests + lint
    cmds:
      - npm run typecheck && npm run test:unit && npm run lint

  db:inspect:
    desc: List tables in the colonyd SQLite database
    cmds:
      - sqlite3 ${COLONYD_DB_PATH:-data/colonyd.db} .tables
