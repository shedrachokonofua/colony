# Colony V2 CI pipeline.
#
# Two stages only: validate (lint + typecheck) and unit tests. No images,
# no deployments — V2 runs as a single local process.

stages:
  - validate
  - unit

variables:
  NIX_CONFIG: "experimental-features = nix-command flakes"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm-cache"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: nixos/nix:2.21.2
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm-cache/
      - node_modules/

.with-deps:
  before_script:
    - nix --version
    - nix develop --command npm ci --prefer-offline --no-audit --no-fund

validate:
  stage: validate
  extends: .with-deps
  script:
    - nix develop --command bash -c 'set -euxo pipefail; npm run lint && npm run typecheck'

unit-tests:
  stage: unit
  extends: .with-deps
  script:
    - nix develop --command npm run test:unit
