# Colony CI pipeline.
#
# Colony packages a container image; the aether repo owns every cluster
# object (tofu/home/kubernetes/colony.tf) and Keel force-polls :latest,
# so a green main branch redeploys itself. Image builds run on Aether's
# `gitlab-runner-k8s` (tagged `buildah`).

stages:
  - validate
  - unit
  - e2e
  - build

variables:
  NIX_CONFIG: "experimental-features = nix-command flakes"
  BUN_INSTALL_CACHE_DIR: "$CI_PROJECT_DIR/.bun-cache"
  STORAGE_DRIVER: "vfs"
  BUILDAH_FORMAT: "docker"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: nixos/nix:2.21.2
  cache:
    key:
      files:
        - bun.lock
    paths:
      - .bun-cache/
      - node_modules/

# COLONY_SHELL picks the flake dev shell: `.#ci` (bun+node+git) for jobs
# that never open a browser; e2e overrides to `.#default` for chromium.
.with-deps:
  variables:
    COLONY_SHELL: ".#ci"
  before_script:
    - nix --version
    - nix develop "$COLONY_SHELL" --command bun install --frozen-lockfile

validate:
  stage: validate
  extends: .with-deps
  script:
    - nix develop "$COLONY_SHELL" --command bash -c 'set -euxo pipefail; bun run lint && bun run typecheck'

unit-tests:
  stage: unit
  extends: .with-deps
  script:
    # timeout guards a bun-at-exit hang (leaked handle keeps the process
    # alive after the summary): fail in 10 minutes, not at the 1h job wall.
    - nix develop "$COLONY_SHELL" --command bash -c 'timeout -k 15 1200 bun run test:unit'

e2e-tests:
  stage: e2e
  extends: .with-deps
  variables:
    COLONY_SHELL: ".#default"
    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  script:
    - nix develop "$COLONY_SHELL" --command bash -c 'export COLONY_TEST_CHROMIUM_PATH="$(command -v chromium)"; timeout -k 15 1800 bun run test:integration && timeout -k 15 1800 bun run test:e2e'

build:colonyd:
  stage: build
  image: quay.io/buildah/stable:latest
  tags:
    - buildah
  cache: []
  before_script:
    - buildah --version
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/colonyd"
    - buildah bud --layers=true --build-arg "COLONY_VERSION=$CI_COMMIT_SHA" -f Dockerfile -t "$IMAGE:$CI_COMMIT_SHA" .
    - buildah push "$IMAGE:$CI_COMMIT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        buildah tag "$IMAGE:$CI_COMMIT_SHA" "$IMAGE:latest"
        buildah push "$IMAGE:latest"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# The kubernetes engine's execution image. Keel force-polls :latest, so a green
# main branch redeploys the default `registry.gitlab.home.shdr.ch/so/colony/sandbox:latest`.
build:sandbox:
  stage: build
  image: quay.io/buildah/stable:latest
  tags:
    - buildah
  cache: []
  before_script:
    - buildah --version
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/sandbox"
    - buildah bud --layers=true -f docker/sandbox/Dockerfile -t "$IMAGE:$CI_COMMIT_SHA" docker/sandbox
    - buildah push "$IMAGE:$CI_COMMIT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        buildah tag "$IMAGE:$CI_COMMIT_SHA" "$IMAGE:latest"
        buildah push "$IMAGE:latest"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
