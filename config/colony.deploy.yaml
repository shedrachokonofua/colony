# Production agent config baked into the colonyd image (see Dockerfile).
# The aether-side deployment points COLONY_CONFIG_PATH here. CI bakes changes
# into a new image; aether pins its immutable digest and rolls it out through
# IaC after quiescing scopes. Keel is disabled; a build alone does not deploy.
#
# Web research (env-gated): web_search/web_fetch are enabled only when
# COLONY_SEARXNG_URL is set (e.g. https://searxng.home.shdr.ch). No API key.
# Activation in this file is deferred — the aether deployment sets the env
# separately after this change merges.
agent_runtime: pi
allow_literal_keys: false

sandbox:
  engine: kubernetes
  kubernetes:
    namespace: colony-sandboxes
    image: registry.gitlab.home.shdr.ch/so/colony/sandbox:latest

# Run-audit artifact store. The deployed pod's image rootfs is not writable
# by uid 1000; the PVC at /var/lib/colonyd is. The default (data/artifacts,
# relative to cwd /workspace) crashed boot on 2026-08-30 — keep this absolute.
artifacts:
  kind: local
  local:
    dir: /var/lib/colonyd/artifacts

# Same landmine as artifacts, second detonation (2026-09-01): the default
# data/sessions resolves against cwd /workspace and EACCES'd every run at
# session-manager creation. Keep absolute, on the PVC beside the DB.
sessions_dir: /var/lib/colonyd/sessions

hitl:
  mode: yolo

review:
  mode: required

providers:
  openai_compatible:
    api: openai-completions
    base_url: https://litellm.home.shdr.ch/v1
    auth:
      kind: api_key
      value: COLONY_OPENAI_COMPATIBLE_API_KEY
    models:
      # 2026-09-02: the 1.2-contributor route left the gateway; 1.3 (index 61,
      # 235 tok/s) replaces it. Contributor is $0.10/M input, $0.20/M output.
      - id: router/muse-spark-1.3-contributor
        name: muse-spark
        reasoning: true
        context_window: 1048576
        # Operational cap, not the model's limit. Turn telemetry from a walled
        # 30-minute run: median turn 404 output tokens, but outliers reached
        # 30k tokens / 203 seconds, and 27 of the 30 minutes went to model
        # generation. Bounding a single response keeps the run acting instead
        # of monologuing.
        max_tokens: 16384
        max_parallel_runs: 1
        cost: { input: 0.1, output: 0.2, cache_read: 0.002 }
      - id: router/glm-5.3
        name: glm-5.3
        reasoning: true
        context_window: 1000000
        max_tokens: 131072
        # z.ai leg carries a weekly usage window; 2 covers architect demand
        # without letting a burst drain it.
        max_parallel_runs: 2
        cost: { input: 0, output: 0 }
      # GLM-5.3-Flash is the named successor to the ended Ox Alpha preview.
      # Pooled across Z.AI, Command Code, OpenCode Go, and Ollama Cloud for
      # quota resilience under developer's high turn volume.
      - id: router/glm-5.3-flash
        name: glm-5.3-flash
        reasoning: true
        context_window: 1048576
        max_tokens: 131072
        # Caps concurrently RUNNING runs across this entry's pooled credentials.
        max_parallel_runs: 3
        cost: { input: 0, output: 0 }
      # Temporary CodeBuddy Hy4 trial route. This endpoint is stream-only and
      # requires a leading system message; Pi's OpenAI transport satisfies both.
      - id: codebuddy/hy4-preview
        name: hy4-preview
        reasoning: true
        context_window: 1048576
        max_tokens: 64000
        # Caps concurrently RUNNING runs on the single CodeBuddy trial credential.
        max_parallel_runs: 1
        cost: { input: 0, output: 0 }
      - id: kimi/k3
        name: kimi-k3
        reasoning: true
        context_window: 1048576
        # K3 rejects named forced tool_choice while reasoning is enabled.
        compat:
          disableReasoningOnForcedToolChoice: true
        max_tokens: 131072
        # Weekly token window (exhausted 2026-08-30); 2 stops a review
        # stampede from draining it in one afternoon.
        max_parallel_runs: 2
        cost: { input: 0, output: 0 }
      - id: router/deepseek-v4-pro
        name: deepseek-v4-pro
        reasoning: true
        context_window: 1048576
        max_tokens: 384000
        max_parallel_runs: 2
        cost: { input: 0, output: 0 }
      - id: qwen-cloud/qwen3.8-max
        name: qwen3.8-max
        reasoning: true
        context_window: 1000000
        max_tokens: 131072
        max_parallel_runs: 1
        cost: { input: 0, output: 0 }
      - id: aether/qwen3.8-27b
        name: qwen3.8-27b
        reasoning: true
        context_window: 262144
        # Operational generation cap; the deployed llama-server shares this
        # model's 262144-token context between prompt and completion.
        max_tokens: 32768
        # Shares one llama-server with interactive use; never double-book it.
        max_parallel_runs: 1
        cost: { input: 0, output: 0 }
      - id: router/muse-spark-1.3
        name: muse-spark-1.3
        reasoning: true
        context_window: 1048576
        max_tokens: 16384
        max_parallel_runs: 2
        cost: { input: 0, output: 0 }
      - id: antigravity/gemini-3.8-flash
        name: gemini-3.8-flash
        reasoning: true
        context_window: 1048576
        max_parallel_runs: 2
        cost: { input: 0, output: 0 }
      - id: qwen-cloud/qwen3.8-flash
        name: qwen3.8-flash
        reasoning: true
        context_window: 1000000
        max_parallel_runs: 2
        cost: { input: 0, output: 0 }
      # Standard Grok 4.7 through the SuperGrok subscription bridge.
      - id: supergrok/grok-4.7
        name: grok-4.7
        reasoning: true
        context_window: 500000
        max_tokens: 65536
        max_parallel_runs: 4
        cost: { input: 0, output: 0 }
      # GPT-6 Astra via the ChatGPT subscription (LiteLLM chatgpt/*; the route
      # is streaming-only, which Pi's transport satisfies). The subscription
      # also serves the household's only OpenWebUI model, so Colony uses it
      # for plan review alone - its lowest-volume role - one run at a time.
      - id: chatgpt/gpt-6-astra
        name: gpt-6-astra
        reasoning: true
        # Operational cap: AA lists a 1M API context, but the subscription
        # route's limit is unverified.
        context_window: 272000
        max_tokens: 65536
        max_parallel_runs: 1
        cost: { input: 0, output: 0 }
      # MiMo V2.6 Pro through LiteLLM's priority pool: the Xiaomi token plan
      # first, Command Code and OpenCode Go only while it fails.
      - id: router/mimo-v2.6-pro
        name: mimo-v2.6-pro
        reasoning: true
        context_window: 1000000
        max_tokens: 131072
        # A named forced tool_choice gets a different tool call back
        # (2026-09-25 probe), so finalizers steer it instead of forcing.
        compat:
          supportsForcedToolChoice: false
        max_parallel_runs: 2
        cost: { input: 0, output: 0 }
      # Step 5 Preview on the Step Plan subscription: a quota pool no other
      # role draws on. Step's API reports 1,024,000 input tokens. It reasons
      # verbosely on open-ended prose (2.5-3.7k tokens for a 400-word answer),
      # so the output cap bounds a runaway turn the way muse-spark's does.
      - id: step/step-5-preview
        name: step-5-preview
        reasoning: true
        context_window: 1024000
        max_tokens: 32768
        # Honoured a named forced tool_choice 1/3 (2026-09-25 probe) while
        # self-submitting 4/4 in two-turn agent loops, so finalizers steer it.
        compat:
          supportsForcedToolChoice: false
        max_parallel_runs: 2
        cost: { input: 0, output: 0 }

agents:
  # Budgets sized from observed run durations (12h window, 2026-08-18):
  # implement 20-26 min at the old 30 min cap, review 10-23 min, plan 8-25 min.
  # 2026-08-30: developer 400 turns / 3 h. Hy4 measures ~47.6 tok/s with 6 s
  # TTFT (~2.3 turns/min), so 400 turns needs ~3 h; on GLM-Flash (~5.7
  # turns/min) turns bind near minute 70. Turns are the divergence guard;
  # the stall/liveness watchdogs cover hangs; the clock is the outer bound.
  # Revert to 5400000 if the coder returns to a GLM-Flash-class model.
  # hy4 leads: the one lane with in-loop evidence (7/7 valid ledger outcomes,
  # Tencent's 163-expert side-by-side beats GLM/Kimi on engineering). Behind
  # it, AA Index with throughput as the tie-break for this long-horizon role:
  # spark Contributor 61 (186 tok/s, $0.10/M in, $0.20/M out);
  # gemini-3.8-flash 59 (302 tok/s, $0.58), glm-5.3-flash 57 ($0.09),
  # qwen3.8-flash.
  # 2026-09-25: mimo-v2.6-pro (AA Index v4.3.2: 46, vs glm-5.3-flash 42 and
  # gemini-3.8-flash 41) goes ahead of glm-5.3-flash, whose implement runs
  # hit 43 rate-limit faults in the 45 days to 2026-09-09. MiMo has no
  # in-loop record yet, so it stays behind the fallbacks that do.
  # step-5-preview (AA 44; separate Step Plan pool) follows mimo-v2.6-pro:
  # 4/4 two-turn agent loops at high/xhigh, 1.3-2.4 s per turn (2026-09-25),
  # ahead of the rate-limited glm-5.3-flash (42) and qwen3.8-flash (AA's
  # Qwen3.8-Flash-Next, 40). Same caveat as MiMo: no in-loop record yet.
  developer:
    provider: openai_compatible
    model: hy4-preview
    fallback_models:
      [
        muse-spark,
        gemini-3.8-flash,
        mimo-v2.6-pro,
        step-5-preview,
        glm-5.3-flash,
        qwen3.8-flash,
      ]
    thinking_level: high
    timeout_ms: 10800000
    max_turns: 400
  # 2026-09-03: Grok 4.6 led code review - 6/8 landed in production that night
  # (the two misses were a daemon restart and an in-flight run), lab 2/2
  # with dense correct findings. qwen3.8-max second on evidence: lab 4/4
  # submitted (4-9 min), opens the diff, runs the typecheck, findings real.
  # Then spark (AA 61), kimi-k3 60, glm-5.3 60, deepseek-v4-pro 53.
  reviewer:
    provider: openai_compatible
    model: grok-4.7
    fallback_models:
      - qwen3.8-max
      - muse-spark-1.3
      - kimi-k3
      - glm-5.3
      - deepseek-v4-pro
    thinking_level: xhigh
    timeout_ms: 2700000
    max_turns: 200
  # Historical Grok 4.6 plan reviews narrated a verdict without calling
  # submit (0/10 in production; the architect chain saw the same behavior).
  # Grok 4.7 plan-review quality is unmeasured; retain the separate chain.
  # The plan reviewer must not be the plan's author: spark leads the
  # architect chain, so a spark-first review is the model grading its own
  # draft - the rubber stamp the review loop exists to replace.
  # 2026-09-25: gpt-6-astra leads (AA Index v4.3.2: 53, the gateway's highest;
  # not an architect head). It honours a forced submit, which qwen3.8-max
  # rejects with HTTP 400: 9 of qwen's 11 failed plan reviews in the 45 days
  # to 2026-09-09 ended without an envelope or at the wall clock. Then
  # qwen3.8-max (32 succeeded), kimi-k3, glm-5.3, deepseek; spark last, for
  # when nothing else answers.
  plan_reviewer:
    provider: openai_compatible
    model: gpt-6-astra
    fallback_models:
      - qwen3.8-max
      - kimi-k3
      - glm-5.3
      - deepseek-v4-pro
      - muse-spark-1.3
    thinking_level: xhigh
    timeout_ms: 2700000
    max_turns: 200
  # 2026-09-03: spark leads through the Contributor route after completing
  # all staged-architect lab submissions; AA Index 61 at xhigh.
  # Contributor is $0.10/M input and $0.20/M output. Behind it, AA Index order:
  # glm-5.3 60, kimi-k3 60, gemini-3.8-flash 59. Grok-4.6 failed forced
  # structured submission after two steers and is excluded from this chain.
  architect:
    provider: openai_compatible
    model: muse-spark
    fallback_models:
      [glm-5.3, kimi-k3, gemini-3.8-flash, qwen3.8-max, deepseek-v4-pro]
    thinking_level: xhigh
    timeout_ms: 2700000
    max_turns: 200
  memory_consolidator:
    provider: openai_compatible
    model: muse-spark
    thinking_level: low
