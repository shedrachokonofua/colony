# Colony CI pipeline.
#
# Colony packages a container image; the aether repo owns every cluster
# object (tofu/home/kubernetes/colony.tf) and Keel force-polls :latest,
# so a green main branch redeploys itself. Image builds run on Aether's
# `gitlab-runner-k8s` (tagged `buildah`).

stages:
  - prepare
  - validate
  - unit
  - test
  - build

# Nested Buildah A/B (pipelines 5043/5044): overlay added about 90s per
# image on this runner, so keep vfs until the substrate changes.
variables:
  STORAGE_DRIVER: "vfs"
  BUILDAH_FORMAT: "docker"

# Jobs only validate or publish replaceable images. Cancel superseded pipelines
# before they compete for runners and the shared registry-backed layer cache.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Test jobs run in prebuilt CI images (docker/ci) that carry git, the pinned
# bun and a warm install cache; the job's `bun install` only links. The
# images rebuild in `prepare` when their inputs change, so a pipeline that
# edits docker/ci or the lockfile tests against the image it just built.
default:
  image: $CI_REGISTRY_IMAGE/ci:latest
  interruptible: true

.with-deps:
  before_script:
    - bun install --frozen-lockfile

.buildah:
  image: quay.io/buildah/stable:latest
  tags:
    - buildah
  cache: []
  before_script:
    - buildah --version
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Job pods discard their local layer store at exit. Registry-backed caches
# retain stable layers across pods/nodes; the 24h TTL refreshes apt metadata.
# Usage: IMAGE, DOCKERFILE, CONTEXT set by the job; extra args in BUILD_ARGS.
.buildah-image:
  extends: .buildah
  script:
    - CACHE_IMAGE="$IMAGE/cache"
    - buildah bud --layers=true --cache-from "$CACHE_IMAGE" --cache-to "$CACHE_IMAGE" --cache-ttl=24h $BUILD_ARGS -f "$DOCKERFILE" -t "$IMAGE:$CI_COMMIT_SHA" "$CONTEXT"
    - buildah push "$IMAGE:$CI_COMMIT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        buildah tag "$IMAGE:$CI_COMMIT_SHA" "$IMAGE:latest"
        buildah push "$IMAGE:latest"
      fi

# CI images publish :latest from any pipeline that changes their inputs, so an
# MR's test jobs run on the image its own change produced.
.ci-image:
  extends: .buildah
  stage: prepare
  script:
    - CACHE_IMAGE="$IMAGE/cache"
    - buildah bud --layers=true --cache-from "$CACHE_IMAGE" --cache-to "$CACHE_IMAGE" --cache-ttl=24h -f "$DOCKERFILE" -t "$IMAGE:latest" .
    - buildah push "$IMAGE:latest"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docker/ci/**
        - bun.lock
        - colony-versions.json

build:ci:
  extends: .ci-image
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/ci
    DOCKERFILE: docker/ci/Dockerfile

build:ci-playwright:
  extends: .ci-image
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/ci-playwright
    DOCKERFILE: docker/ci/playwright.Dockerfile

validate:
  stage: validate
  extends: .with-deps
  script:
    - bash -c 'set -euxo pipefail; bun run lint && bun run typecheck'

unit-tests:
  stage: test
  extends: .with-deps
  script:
    # timeout guards a bun-at-exit hang (leaked handle keeps the process
    # alive after the summary): fail in 10 minutes, not at the 1h job wall.
    - timeout -k 15 1200 bun run test:unit

integration-tests:
  stage: test
  extends: .with-deps
  script:
    - timeout -k 15 1800 bun run test:integration

playwright-tests:
  stage: test
  extends: .with-deps
  image: $CI_REGISTRY_IMAGE/ci-playwright:latest
  script:
    - timeout -k 15 1800 bun run test:e2e

build:colonyd:
  extends: .buildah-image
  stage: build
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/colonyd
    DOCKERFILE: Dockerfile
    CONTEXT: .
    BUILD_ARGS: --build-arg COLONY_VERSION=$CI_COMMIT_SHA

# The kubernetes engine's execution image. Keel force-polls :latest, so a green
# main branch redeploys the default `registry.gitlab.home.shdr.ch/so/colony/sandbox:latest`.
build:sandbox:
  extends: .buildah-image
  stage: build
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/sandbox
    DOCKERFILE: docker/sandbox/Dockerfile
    CONTEXT: docker/sandbox

# Nightly model-harness + sandbox conformance against the live LiteLLM route
# and the kubernetes engine. Scheduled on main only: it spends real provider
# quota and provisions Kata pods, neither of which belongs on an MR pipeline.
#
# jq is absent from the .#ci shell, so every version read is a bun/node
# one-liner over colony-versions.json (the file that pins both runtimes).
#
# The harness suite writes harness-conformance-table.md in the job's cwd; the
# artifact is kept even on failure (when: always) because a red nightly is
# exactly when someone needs to read which model failed which capability.
nightly-conformance:
  stage: unit
  extends: .with-deps
  variables:
    COLONY_SHELL: ".#ci"
    COLONY_K8S_ENGINE_TESTS: "1"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
  script:
    # The pinned runtimes come from the one file that owns them; a nightly
    # that ran a different bun would report model failures that are really
    # toolchain drift.
    - |
      BUN_PINNED=$(bun -e 'console.log(JSON.parse(require("node:fs").readFileSync("colony-versions.json", "utf8")).bun)')
      NODE_PINNED=$(node -p 'require("./colony-versions.json").node')
      echo "pinned bun=${BUN_PINNED} node=${NODE_PINNED}; running bun=$(bun --version) node=$(node --version)"
      [ "$(bun --version)" = "$BUN_PINNED" ] || { echo "bun is $(bun --version), colony-versions.json pins ${BUN_PINNED}"; exit 1; }
      [ "$(node --version)" = "$NODE_PINNED" ] || { echo "node is $(node --version), colony-versions.json pins ${NODE_PINNED}"; exit 1; }
    - |
      if [ -z "$COLONY_LIVE_GATEWAY" ]; then
        echo "COLONY_LIVE_GATEWAY is required: nightly conformance drives real models through the live LiteLLM gateway"
        exit 1
      fi
    - timeout -k 15 300 bun test packages/agent-runtime/src/submit-tool-schema-shape.test.ts
    - timeout -k 15 1800 bun test packages/agent-runtime/src/harness-conformance.test.ts
    - timeout -k 15 1800 bun test packages/sandbox-k8s/src/sandbox-conformance.kubernetes.integration.test.ts
    - |
      # The suite prints FAIL lines as it runs; re-derive them from the table
      # so the job log names every failing model/role/capability even when
      # the earlier output has scrolled. No jq in .#ci, so this is node.
      if [ -f harness-conformance-table.md ]; then
        cat harness-conformance-table.md
        node -e '
          const fs = require("node:fs");
          const lines = fs.readFileSync("harness-conformance-table.md", "utf8")
            .split("\n")
            .filter((line) => line.startsWith("|"));
          const columns = lines[0].split("|").slice(1, -1).slice(1)
            .map((cell) => cell.trim().replace(/`/g, ""));
          for (const line of lines.slice(2)) {
            const cells = line.split("|").map((cell) => cell.trim());
            const capability = cells[1];
            if (!capability || capability === "turns") continue;
            cells.slice(2, -1).forEach((cell, index) => {
              if (cell !== "FAIL") return;
              const parsed = /^(.*) \((.*)\)$/.exec(columns[index] ?? "");
              console.log(
                "FAIL model=" + (parsed ? parsed[1] : columns[index]) +
                " role=" + (parsed ? parsed[2] : "unknown") +
                " capability=" + capability,
              );
            });
          }
        '
      fi
  artifacts:
    paths:
      - harness-conformance-table.md
    when: always
    expire_in: 30 days
