# Colony CI pipeline.
#
# Deploys directly to the Aether host cluster (talos), not into any vcluster.
# Aether's `aether-k8s` GitLab Agent already authorizes the `so` group (see
# ~/projects/aether/.gitlab/agents/aether-k8s/config.yaml), so Colony's CI
# can `kubectl`/Tofu against the cluster with no Aether change. Image builds
# run on Aether's `gitlab-runner-k8s` (Helm-installed in the gitlab-runner
# namespace, tagged `buildah`).
#
# See docs/ci.md and ADR-006 / ADR-007.

stages:
  - validate
  - unit
  - integration
  - build
  - plan
  - apply

variables:
  # Allow flake-aware nix CLI subcommands inside the nixos/nix image.
  NIX_CONFIG: "experimental-features = nix-command flakes"
  # Keep npm's HTTP cache inside the project dir so GitLab cache: picks it up.
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm-cache"
  # Buildah rootless defaults; the runner can override storage driver.
  STORAGE_DRIVER: "vfs"
  BUILDAH_FORMAT: "docker"
  # Tofu module location.
  TF_ROOT: tofu
  TOFU_VERSION: "1.11"
  # GitLab-managed Tofu state auth (auto-injected from CI).
  TF_HTTP_USERNAME: gitlab-ci-token
  TF_HTTP_PASSWORD: $CI_JOB_TOKEN
  # OpenBao on Aether. The vault provider in tofu/ reads from this.
  VAULT_ADDR: https://bao.home.shdr.ch
  # Aether GitLab Agent. AETHER_AGENT_ID is the registered numeric ID of
  # `aether-k8s` (set as a project/group CI variable, default 1).
  GITLAB_KAS_PROXY: "https://gitlab.home.shdr.ch/-/kubernetes-agent/k8s-proxy/"
  AETHER_AGENT_ID: "1"

# Pipelines run on merge requests, on the default branch, and on tags.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: nixos/nix:2.21.2
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm-cache/
      - node_modules/
      - apps/*/node_modules/
      - packages/*/node_modules/

# ---------------------------------------------------------------------------
# Reusable hidden jobs
# ---------------------------------------------------------------------------

.with-deps:
  before_script:
    - nix --version
    - nix develop --command npm ci --prefer-offline --no-audit --no-fund

# Builds a kubeconfig that targets Aether's host cluster via the GitLab
# Kubernetes Agent's k8s-proxy. Same pattern as the static-site template
# (gitlab.home.shdr.ch/so/templates/static-site).
.kube-auth-aether:
  before_script:
    - apk add --no-cache -q curl jq kubectl
    - |
      kubectl config set-cluster aether \
        --server="${GITLAB_KAS_PROXY}" \
        --insecure-skip-tls-verify=true
      kubectl config set-credentials agent \
        --token="ci:${AETHER_AGENT_ID}:${CI_JOB_TOKEN}"
      kubectl config set-context aether \
        --cluster=aether --user=agent
      kubectl config use-context aether
      export KUBECONFIG="$HOME/.kube/config"
      export KUBE_CONFIG_PATH="$KUBECONFIG"

# Exchanges the GitLab OIDC JWT for a VAULT_TOKEN on Aether's OpenBao.
# Depends on the `jwt-gitlab-colony` mount + `colony-ci` role landing in
# Aether (see docs/aether-handoff.md). Until that MR merges, plan/apply jobs
# stay gated on `exists: tofu/main.tf`.
.bao-auth:
  id_tokens:
    BAO_JWT:
      aud: https://bao.home.shdr.ch
  before_script:
    - apk add --no-cache -q curl jq kubectl
    - |
      BAO_RESP=$(curl -s --fail-with-body --request POST \
        --data "{\"jwt\":\"$BAO_JWT\",\"role\":\"colony-ci\"}" \
        "$VAULT_ADDR/v1/auth/jwt-gitlab-colony/login") || {
          echo "ERROR: OpenBao JWT login failed:"
          echo "$BAO_RESP" | jq . 2>/dev/null || echo "$BAO_RESP"
          exit 1
        }
      export VAULT_TOKEN=$(echo "$BAO_RESP" | jq -r '.auth.client_token')
      [ -n "$VAULT_TOKEN" ] && [ "$VAULT_TOKEN" != "null" ] || { echo "empty token"; exit 1; }

# GitLab does not concatenate before_script arrays across multiple extends.
# Tofu jobs need both kubeconfig and Bao auth, so keep the combined setup in
# one parent instead of extending .kube-auth-aether and .bao-auth separately.
.aether-tofu-auth:
  id_tokens:
    BAO_JWT:
      aud: https://bao.home.shdr.ch
  before_script:
    - apk add --no-cache -q curl jq kubectl
    - |
      kubectl config set-cluster aether \
        --server="${GITLAB_KAS_PROXY}" \
        --insecure-skip-tls-verify=true
      kubectl config set-credentials agent \
        --token="ci:${AETHER_AGENT_ID}:${CI_JOB_TOKEN}"
      kubectl config set-context aether \
        --cluster=aether --user=agent
      kubectl config use-context aether
      export KUBECONFIG="$HOME/.kube/config"
      export KUBE_CONFIG_PATH="$KUBECONFIG"
    - |
      BAO_RESP=$(curl -s --fail-with-body --request POST \
        --data "{\"jwt\":\"$BAO_JWT\",\"role\":\"colony-ci\"}" \
        "$VAULT_ADDR/v1/auth/jwt-gitlab-colony/login") || {
          echo "ERROR: OpenBao JWT login failed:"
          echo "$BAO_RESP" | jq . 2>/dev/null || echo "$BAO_RESP"
          exit 1
        }
      export VAULT_TOKEN=$(echo "$BAO_RESP" | jq -r '.auth.client_token')
      [ -n "$VAULT_TOKEN" ] && [ "$VAULT_TOKEN" != "null" ] || { echo "empty token"; exit 1; }

# Buildah base. Image builds run on the buildah-tagged Aether k8s runner.
.image-build:
  stage: build
  image: quay.io/buildah/stable:latest
  tags:
    - buildah
  cache: []
  before_script:
    - buildah --version
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

.integration-postgres:
  stage: integration
  extends: .with-deps
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: colony_test
    POSTGRES_USER: colony
    POSTGRES_PASSWORD: colony
    COLONY_TEST_DATABASE_URL: postgres://colony:colony@postgres:5432/colony_test

# ---------------------------------------------------------------------------
# validate stage — single Nix-driven workspace check.
#
# All workspace gates share the same image and dep cache; running them in
# one job chained inside a single `nix develop` invocation avoids paying
# the dev-shell entry cost six times. `tofu-validate` stays separate
# because it uses a different image and is gated on `tofu/main.tf`.
# ---------------------------------------------------------------------------

validate:
  stage: validate
  extends: .with-deps
  script:
    - nix flake check --no-build
    - |
      nix develop --command bash -c '
        set -euxo pipefail
        npm run format:check
        npm run lint
        npm run typecheck
        npm run schemas:check
        npm run openapi:check
      '

unit-tests:
  stage: unit
  extends: .with-deps
  script:
    - nix develop --command npm run test:unit

# ---------------------------------------------------------------------------
# integration stage — single job covering db + api + provider-gitlab.
#
# `npm run test:integration` chains all three suites via run-s; the
# postgres service backs the db + api suites and is harmless for the
# provider-gitlab contract suite.
# ---------------------------------------------------------------------------

integration:
  extends: .integration-postgres
  script:
    - nix develop --command bash -lc 'until pg_isready -h postgres -U colony -d colony_test; do sleep 1; done; npm run test:integration'

tofu-validate:
  stage: validate
  needs: []
  image:
    name: ghcr.io/opentofu/opentofu:1.11
    entrypoint: [""]
  cache: []
  script:
    - cd ${TF_ROOT}
    - tofu init -backend=false
    - tofu validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      exists:
        - tofu/main.tf
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists:
        - tofu/main.tf

# ---------------------------------------------------------------------------
# build stage — per-app images via Buildah
# ---------------------------------------------------------------------------

.image-build-app:
  extends: .image-build
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/$APP"
    - buildah bud --layers=true -f "apps/$APP/Dockerfile" -t "$IMAGE:$CI_COMMIT_SHA" .
    - buildah push "$IMAGE:$CI_COMMIT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        buildah tag "$IMAGE:$CI_COMMIT_SHA" "$IMAGE:latest"
        buildah push "$IMAGE:latest"
      fi

build:api:
  extends: .image-build-app
  variables:
    APP: api

build:worker:
  extends: .image-build-app
  variables:
    APP: worker

build:webhook-dispatcher:
  extends: .image-build-app
  variables:
    APP: webhook-dispatcher

build:tool-gateway:
  extends: .image-build-app
  variables:
    APP: tool-gateway

build:web:
  extends: .image-build-app
  variables:
    APP: web

# ---------------------------------------------------------------------------
# plan / apply stages — Tofu against the Aether host cluster.
# tofu/ lands in COL-1.9; both jobs are gated on its presence until then.
# ---------------------------------------------------------------------------

plan:
  stage: plan
  image:
    name: ghcr.io/opentofu/opentofu:1.11
    entrypoint: [""]
  cache: []
  extends: .aether-tofu-auth
  script:
    - cd ${TF_ROOT}
    - tofu init
    - tofu plan -lock=false -var "image_registry=$CI_REGISTRY_IMAGE" -var "image_tag=$CI_COMMIT_SHA" -var "enforce_pinned_images=true" -out=plan.cache
    - tofu show -json plan.cache > plan.json
    - tofu show -no-color plan.cache > plan.txt
  artifacts:
    paths:
      - ${TF_ROOT}/plan.cache
      - ${TF_ROOT}/plan.json
      - ${TF_ROOT}/plan.txt
    reports:
      terraform: ${TF_ROOT}/plan.json
  needs:
    - job: build:api
      optional: true
    - job: build:worker
      optional: true
    - job: build:webhook-dispatcher
      optional: true
    - job: build:tool-gateway
      optional: true
    - job: build:web
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      exists:
        - tofu/main.tf
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists:
        - tofu/main.tf

apply:
  stage: apply
  image:
    name: ghcr.io/opentofu/opentofu:1.11
    entrypoint: [""]
  cache: []
  extends: .aether-tofu-auth
  script:
    - cd ${TF_ROOT}
    - tofu init
    - tofu apply -auto-approve plan.cache
  dependencies:
    - plan
  needs:
    - job: plan
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists:
        - tofu/main.tf
      when: manual
