# Colony CI pipeline.
#
# Colony packages a container image; the aether repo owns every cluster
# object (tofu/home/kubernetes/colony.tf) and Keel force-polls :latest,
# so a green main branch redeploys itself. Image builds run on Aether's
# `gitlab-runner-k8s` (tagged `buildah`).

stages:
  - validate
  - test
  - build

# Nested Buildah A/B (pipelines 5043/5044): overlay added about 90s per
# image on this runner, so keep vfs until the substrate changes.
variables:
  STORAGE_DRIVER: "vfs"
  BUILDAH_FORMAT: "docker"

# Jobs only validate or publish replaceable images. Cancel superseded pipelines
# before they compete for runners and the shared registry-backed layer cache.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: oven/bun:1.3.14-debian
  interruptible: true

# Test jobs run in pinned runtime images. Installing git is materially cheaper
# than realizing the Nix shell in every job; flake.nix remains the local shell.
.with-deps:
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
    - bun install --frozen-lockfile

validate:
  stage: validate
  extends: .with-deps
  script:
    - bash -c 'set -euxo pipefail; bun run lint && bun run typecheck'

unit-tests:
  stage: test
  extends: .with-deps
  script:
    # timeout guards a bun-at-exit hang (leaked handle keeps the process
    # alive after the summary): fail in 10 minutes, not at the 1h job wall.
    - timeout -k 15 1200 bun run test:unit

integration-tests:
  stage: test
  extends: .with-deps
  script:
    - timeout -k 15 1800 bun run test:integration

playwright-tests:
  stage: test
  extends: .with-deps
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  variables:
    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  before_script:
    - npm install --global bun@1.3.14
    - bun install --frozen-lockfile
  script:
    - timeout -k 15 1800 bun run test:e2e

# Job pods discard their local layer store at exit. Registry-backed caches
# retain stable layers across pods/nodes; the 24h TTL refreshes apt metadata.
build:colonyd:
  stage: build
  image: quay.io/buildah/stable:latest
  tags:
    - buildah
  cache: []
  before_script:
    - buildah --version
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/colonyd"
    - CACHE_IMAGE="$IMAGE/cache"
    - buildah bud --layers=true --cache-from "$CACHE_IMAGE" --cache-to "$CACHE_IMAGE" --cache-ttl=24h --build-arg "COLONY_VERSION=$CI_COMMIT_SHA" -f Dockerfile -t "$IMAGE:$CI_COMMIT_SHA" .
    - buildah push "$IMAGE:$CI_COMMIT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        buildah tag "$IMAGE:$CI_COMMIT_SHA" "$IMAGE:latest"
        buildah push "$IMAGE:latest"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# The kubernetes engine's execution image. Keel force-polls :latest, so a green
# main branch redeploys the default `registry.gitlab.home.shdr.ch/so/colony/sandbox:latest`.
build:sandbox:
  stage: build
  image: quay.io/buildah/stable:latest
  tags:
    - buildah
  cache: []
  before_script:
    - buildah --version
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/sandbox"
    - CACHE_IMAGE="$IMAGE/cache"
    - buildah bud --layers=true --cache-from "$CACHE_IMAGE" --cache-to "$CACHE_IMAGE" --cache-ttl=24h -f docker/sandbox/Dockerfile -t "$IMAGE:$CI_COMMIT_SHA" docker/sandbox
    - buildah push "$IMAGE:$CI_COMMIT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        buildah tag "$IMAGE:$CI_COMMIT_SHA" "$IMAGE:latest"
        buildah push "$IMAGE:latest"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
