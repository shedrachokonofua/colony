# Production agent config baked into the colonyd image (see Dockerfile).
# The aether-side deployment points COLONY_CONFIG_PATH here; editing this
# file redeploys colonyd through the normal image build on main.
#
# Web research (env-gated): web_search/web_fetch are enabled only when
# COLONY_SEARXNG_URL is set (e.g. https://searxng.home.shdr.ch). No API key.
# Activation in this file is deferred — the aether deployment sets the env
# separately after this change merges.
agent_runtime: pi
allow_literal_keys: false

sandbox:
  engine: kubernetes
  kubernetes:
    namespace: colony-sandboxes
    image: registry.gitlab.home.shdr.ch/so/colony/sandbox:latest

# Run-audit artifact store. The deployed pod's image rootfs is not writable
# by uid 1000; the PVC at /var/lib/colonyd is. The default (data/artifacts,
# relative to cwd /workspace) crashed boot on 2026-08-30 — keep this absolute.
artifacts:
  kind: local
  local:
    dir: /var/lib/colonyd/artifacts

# Same landmine as artifacts, second detonation (2026-09-01): the default
# data/sessions resolves against cwd /workspace and EACCES'd every run at
# session-manager creation. Keep absolute, on the PVC beside the DB.
sessions_dir: /var/lib/colonyd/sessions

hitl:
  mode: yolo

review:
  mode: required

providers:
  openai_compatible:
    api: openai-completions
    base_url: https://litellm.home.shdr.ch/v1
    auth:
      kind: api_key
      value: COLONY_OPENAI_COMPATIBLE_API_KEY
    models:
      # 2026-09-02: the 1.2-contributor route left the gateway; 1.3 (index 61,
      # 235 tok/s) replaces it. Contributor is $0.10/M input, $0.20/M output.
      - id: router/muse-spark-1.3-contributor
        name: muse-spark
        reasoning: true
        context_window: 1048576
        # Operational cap, not the model's limit. Turn telemetry from a walled
        # 30-minute run: median turn 404 output tokens, but outliers reached
        # 30k tokens / 203 seconds, and 27 of the 30 minutes went to model
        # generation. Bounding a single response keeps the run acting instead
        # of monologuing.
        max_tokens: 16384
        max_parallel_runs: 1
        cost: { input: 0.1, output: 0.2, cache_read: 0.002 }
      - id: router/glm-5.3
        name: glm-5.3
        reasoning: true
        context_window: 1000000
        max_tokens: 131072
        # z.ai leg carries a weekly usage window; 2 covers architect demand
        # without letting a burst drain it.
        max_parallel_runs: 2
        cost: { input: 0, output: 0 }
      # ox-alpha's free stealth preview ended; OpenRouter and aether's own
      # litellm config both confirm the named successor is GLM-5.3-Flash.
      # Pooled across 5 credentials (clinepass, zai, commandcode, opencode-go,
      # ollama-cloud) for quota resilience under developer's high turn volume.
      - id: router/glm-5.3-flash
        name: glm-5.3-flash
        reasoning: true
        context_window: 1048576
        max_tokens: 131072
        # Caps concurrently RUNNING runs across this entry's pooled credentials (5 keys).
        max_parallel_runs: 3
        cost: { input: 0, output: 0 }
      # Temporary CodeBuddy Hy4 trial route. This endpoint is stream-only and
      # requires a leading system message; Pi's OpenAI transport satisfies both.
      - id: codebuddy/hy4-preview
        name: hy4-preview
        reasoning: true
        context_window: 1048576
        max_tokens: 64000
        # Caps concurrently RUNNING runs on the single CodeBuddy trial credential.
        max_parallel_runs: 1
        cost: { input: 0, output: 0 }
      - id: kimi/k3
        name: kimi-k3
        reasoning: true
        context_window: 1048576
        max_tokens: 131072
        # Weekly token window (exhausted 2026-08-30); 2 stops a review
        # stampede from draining it in one afternoon.
        max_parallel_runs: 2
        cost: { input: 0, output: 0 }
      - id: router/deepseek-v4-pro
        name: deepseek-v4-pro
        reasoning: true
        context_window: 1048576
        max_tokens: 384000
        max_parallel_runs: 2
        cost: { input: 0, output: 0 }
      - id: router/deepseek-v4-flash
        name: deepseek-v4-flash
        reasoning: true
        context_window: 1048576
        max_tokens: 384000
        max_parallel_runs: 3
        cost: { input: 0, output: 0 }
      - id: qwen-cloud/qwen3.8-max
        name: qwen3.8-max
        reasoning: true
        context_window: 1000000
        max_tokens: 131072
        max_parallel_runs: 1
        cost: { input: 0, output: 0 }
      - id: aether/qwen3.8-27b
        name: qwen3.8-27b
        reasoning: true
        context_window: 262144
        # Operational generation cap; the deployed llama-server shares this
        # model's 262144-token context between prompt and completion.
        max_tokens: 32768
        # Shares one llama-server with interactive use; never double-book it.
        max_parallel_runs: 1
        cost: { input: 0, output: 0 }
      # Grok 4.6 through the Cursor bridge (separate subscription pool with
      # headroom). Quality-escalation seat: reviewer first fallback, architect
      # fallback, developer last resort. The litellm leg drops max_tokens
      # (Cursor 400s on it).
      - id: router/muse-spark-1.3
        name: muse-spark-1.3
        reasoning: true
        context_window: 1048576
        max_tokens: 16384
        max_parallel_runs: 2
        cost: { input: 0, output: 0 }
      - id: antigravity/gemini-3.8-flash
        name: gemini-3.8-flash
        reasoning: true
        context_window: 1048576
        max_parallel_runs: 2
        cost: { input: 0, output: 0 }
      - id: qwen-cloud/qwen3.8-flash
        name: qwen3.8-flash
        reasoning: true
        context_window: 1000000
        max_parallel_runs: 2
        cost: { input: 0, output: 0 }
      - id: router/mimo-v2.5-pro
        name: mimo-v2.5-pro
        reasoning: true
        context_window: 262144
        max_parallel_runs: 2
        cost: { input: 0, output: 0 }
      - id: cursor/grok-4.6
        name: grok-4.6
        reasoning: true
        context_window: 262144
        max_tokens: 65536
        max_parallel_runs: 4
        cost: { input: 0, output: 0 }

agents:
  # Budgets sized from observed run durations (12h window, 2026-08-18):
  # implement 20-26 min at the old 30 min cap, review 10-23 min, plan 8-25 min.
  # 2026-08-30: developer 400 turns / 3 h. Hy4 measures ~47.6 tok/s with 6 s
  # TTFT (~2.3 turns/min), so 400 turns needs ~3 h; on GLM-Flash (~5.7
  # turns/min) turns bind near minute 70. Turns are the divergence guard;
  # the stall/liveness watchdogs cover hangs; the clock is the outer bound.
  # Revert to 5400000 if the coder returns to a GLM-Flash-class model.
  # hy4 leads: the one lane with in-loop evidence (7/7 valid ledger outcomes,
  # Tencent's 163-expert side-by-side beats GLM/Kimi on engineering). Behind
  # it, AA Index with throughput as the tie-break for this long-horizon role:
  # spark Contributor 61 (186 tok/s, $0.10/M in, $0.20/M out);
  # gemini-3.8-flash 59 (302 tok/s, $0.58), glm-5.3-flash 57 ($0.09),
  # deepseek-v4-flash 52 (137 tok/s, $0.11), qwen3.8-flash.
  developer:
    provider: openai_compatible
    model: hy4-preview
    fallback_models:
      [
        muse-spark,
        gemini-3.8-flash,
        glm-5.3-flash,
        deepseek-v4-flash,
        qwen3.8-flash,
      ]
    thinking_level: high
    timeout_ms: 10800000
    max_turns: 400
  # 2026-09-03: grok leads - review is the shape it has proven (lab 2/2, dense
  # correct findings; its ledger no-submit loop was the bridge's tool channel,
  # fixed tonight). Behind it, AA Index order: spark Contributor 61 ($0.10/M
  # input, $0.20/M output), kimi-k3 60, glm-5.3 60, qwen3.8-max 58,
  # deepseek-v4-pro 53.
  # Quota state is not a ranking input: exhaustion is transient and the
  # fallback walk handles a 402 by moving on.
  reviewer:
    provider: openai_compatible
    model: grok-4.6
    fallback_models:
      - muse-spark
      - kimi-k3
      - glm-5.3
      - qwen3.8-max
      - deepseek-v4-pro
    thinking_level: xhigh
    timeout_ms: 2700000
    max_turns: 200
  # 2026-09-03: spark leads through the Contributor route. Staged architect
  # lab 3/3 submissions in 5-8 min (survey/plan/verify); AA Index 61 at xhigh.
  # Contributor is $0.10/M input and $0.20/M output. Behind it, AA Index order:
  # glm-5.3 60, kimi-k3 60, gemini-3.8-flash 59,
  # Forced submit_survey_notes still produced no tool call after two steers
  # (grok-toolchoice, 2026-09-03); grok-4.6 is removed from this chain.
  architect:
    provider: openai_compatible
    model: muse-spark
    fallback_models:
      [
        glm-5.3,
        kimi-k3,
        gemini-3.8-flash,
        qwen3.8-max,
        deepseek-v4-pro,
      ]
    thinking_level: xhigh
    timeout_ms: 2700000
    max_turns: 200
  memory_consolidator:
    provider: openai_compatible
    model: muse-spark
    thinking_level: low
